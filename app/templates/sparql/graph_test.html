<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Graph Test</title>
<link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.9/styles/vis-network.min.css">
<style>
    body { font-family: sans-serif; margin: 2rem; background: #f5f5f5; }
    h2 { margin-bottom: 1rem; }
    #graph { width: 100%; height: 500px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
    #status { margin-top: 1rem; font-size: 0.85rem; color: #555; }
</style>
</head>
<body>
<h2>Graph View — Test Page (mock triples)</h2>
<div id="graph"></div>
<div id="status">Initialising…</div>

<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script>
var mockTriples = [
    { s: 'http://example.org/dataset/A', p: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type',     o: 'http://www.w3.org/ns/dcat#Dataset' },
    { s: 'http://example.org/dataset/A', p: 'http://purl.org/dc/terms/title',                       o: '"EEPA Health Survey 2023"' },
    { s: 'http://example.org/dataset/A', p: 'http://purl.org/dc/terms/publisher',                   o: 'http://example.org/org/EEPA' },
    { s: 'http://example.org/dataset/A', p: 'http://www.w3.org/ns/dcat#distribution',               o: 'http://example.org/dist/A1' },
    { s: 'http://example.org/dist/A1',   p: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type',     o: 'http://www.w3.org/ns/dcat#Distribution' },
    { s: 'http://example.org/dist/A1',   p: 'http://www.w3.org/ns/dcat#accessURL',                 o: 'http://example.org/sparql/A' },
    { s: 'http://example.org/org/EEPA',  p: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type',     o: 'http://xmlns.com/foaf/0.1/Organization' },
    { s: 'http://example.org/org/EEPA',  p: 'http://xmlns.com/foaf/0.1/name',                      o: '"Ethiopian Economic Policy Research Institute"' },
    { s: 'http://example.org/dataset/B', p: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#type',     o: 'http://www.w3.org/ns/dcat#Dataset' },
    { s: 'http://example.org/dataset/B', p: 'http://purl.org/dc/terms/publisher',                   o: 'http://example.org/org/VODAN' },
    { s: 'http://example.org/dataset/B', p: 'http://purl.org/dc/terms/title',                       o: '"VODAN Africa Dataset"' },
    { s: 'http://example.org/org/VODAN', p: 'http://xmlns.com/foaf/0.1/name',                       o: '"VODAN Africa"' },
];

function localName(uri) {
    var h = uri.lastIndexOf('#');
    var s = uri.lastIndexOf('/');
    var cut = Math.max(h, s);
    var local = cut >= 0 ? uri.slice(cut + 1) : uri;
    return local.length > 36 ? local.slice(0, 34) + '…' : local;
}

function isLiteral(val) { return val.startsWith('"'); }

var nodeMap = {};
var edges = [];
var nodeId = 0;

function getOrCreateNode(val, isSubject) {
    if (nodeMap[val]) return nodeMap[val];
    var lit = isLiteral(val);
    var label = lit ? val.replace(/^"|".*$/g, '').slice(0, 36) : localName(val);
    nodeMap[val] = {
        id: nodeId++,
        label: label,
        title: val,
        color: lit
            ? { background: '#f0c040', border: '#b8922a', highlight: { background: '#f5d060', border: '#b8922a' } }
            : isSubject
                ? { background: '#4e79b5', border: '#2d5a8e', highlight: { background: '#6b94cc', border: '#2d5a8e' } }
                : { background: '#6aab6a', border: '#3d7a3d', highlight: { background: '#85c485', border: '#3d7a3d' } },
        font: { color: lit ? '#333' : '#fff', size: 12 },
        shape: lit ? 'box' : 'ellipse'
    };
    return nodeMap[val];
};

mockTriples.forEach(function(t) {
    var sNode = getOrCreateNode(t.s, true);
    var oNode = getOrCreateNode(t.o, false);
    edges.push({
        from: sNode.id, to: oNode.id,
        label: localName(t.p),
        title: t.p,
        arrows: 'to',
        font: { size: 10, align: 'middle' },
        color: { color: '#999' }
    });
});

var nodes = Object.values(nodeMap);
document.getElementById('status').textContent =
    nodes.length + ' nodes, ' + edges.length + ' edges — rendering…';

try {
    var network = new vis.Network(
        document.getElementById('graph'),
        { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) },
        {
            layout: { improvedLayout: true },
            physics: {
                stabilization: { iterations: 150 },
                barnesHut: { gravitationalConstant: -3000, springLength: 120 }
            },
            interaction: { hover: true, tooltipDelay: 100 },
            edges: { smooth: { type: 'dynamic' } }
        }
    );
    network.on('stabilizationIterationsDone', function() {
        document.getElementById('status').textContent = 'Done. ' + nodes.length + ' nodes, ' + edges.length + ' edges.';
        network.setOptions({ physics: false });
    });
} catch(e) {
    document.getElementById('status').textContent = 'ERROR: ' + e.message;
}
</script>
</body>
</html>
